name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        certbot: [">=5.0.0,<6"]
        acme: [">=5.0.0,<6"]
        include:
          - python: "3.10"
            certbot: "==5.0.0"
            acme: "==5.0.0"
    name: Python ${{ matrix.python }} / Certbot ${{ matrix.certbot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel and test dependencies
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[test]" "certbot${{ matrix.certbot }}" "acme${{ matrix.acme }}"
          python -m pip check
      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib
      - name: Reject the incompatible dependency combinations from issue 4
        if: matrix.certbot == '==5.0.0'
        shell: bash
        run: |
          wheels=(dist/*.whl)
          for requirement in 'certbot==1.32.0' 'acme==4.0.0'; do
            if python -m pip install --dry-run --ignore-installed "${wheels[0]}" "$requirement" > "$RUNNER_TEMP/resolver.log" 2>&1; then
              cat "$RUNNER_TEMP/resolver.log"
              exit 1
            fi
            cat "$RUNNER_TEMP/resolver.log"
            grep -F 'ResolutionImpossible' "$RUNNER_TEMP/resolver.log"
          done
      - name: Discover the installed Certbot plugin
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          OCI_CONFIG_FILE: ${{ runner.temp }}/nonexistent-oci-config
        run: |
          certbot --version
          output="$(certbot plugins --authenticators \
            --config-dir "$RUNNER_TEMP/certbot-config" \
            --work-dir "$RUNNER_TEMP/certbot-work" \
            --logs-dir "$RUNNER_TEMP/certbot-logs")"
          printf '%s\n' "$output"
          grep -F -- '* dns-oci' <<< "$output"
