[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-dns-oci"
version = "0.2.0"
description = "OCI DNS Authenticator plugin for Certbot"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Chris Johnson", email = "christopher.johnson@oracle.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    # Keep ACME in the supported major series even if Certbot has no upper bound.
    "acme>=5.0.0,<6",
    "certbot>=5.0.0,<6",
    "circuitbreaker>=1.3.1,<3",
    "oci>=2.187.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/damithkothalawala/certbot-dns-oci"
Repository = "https://github.com/damithkothalawala/certbot-dns-oci"
Issues = "https://github.com/damithkothalawala/certbot-dns-oci/issues"

[project.entry-points."certbot.plugins"]
dns-oci = "certbot_dns_oci.dns_oci:Authenticator"

[tool.setuptools.packages.find]
include = ["certbot_dns_oci*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
